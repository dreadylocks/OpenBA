name: Release
# Builds the release flavour on the three platforms, runs the unit tests on that flavour, packages
# each platform (tools/release/package.sh; tools/macos/make_app.sh + make_release_zip.sh) and, on a
# `v*` tag, publishes the GitHub release with the CHANGELOG.md section of that version as its notes.
#
# Dry run: a pull request that touches the release tooling, or a manual dispatch, runs every job
# but `release`; the packages are the run's artifacts. The tag must equal `v<CMake VERSION>`
# (README "Versioning"); the `version` job refuses anything else before a single build starts.
#
# Nothing here needs the game (AGENTS.md section 1): the Windows gate and the serializer check stay
# the maintainer's steps before the tag is pushed.
#
# Code signing (CODE_SIGNING.md, setup in docs/reference/code_signing.md): on a `v*` tag the Windows
# exe goes to SignPath and the signed copy is packaged. Off until the repository variable
# SIGNPATH_ORGANIZATION_ID is set; until then every package is unsigned, as before. A manual
# dispatch with test_sign signs with SignPath's test-signing policy, to check the setup.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release/**
      - tools/macos/**
      - packaging/**
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      test_sign:
        description: Sign the Windows exe with SignPath's test-signing policy (checks the signing setup)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  BUILD_JOBS: 4
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 400M
  CCACHE_LAUNCHERS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
jobs:
  version:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: CMake VERSION, tag check, CHANGELOG section
        id: v
        run: |
          VER="$(sed -nE 's/^project\([^)]*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          [ -n "$VER" ] || { echo "no project(... VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          echo "CMake VERSION $VER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            [ "$TAG" = "v$VER" ] || { echo "tag $TAG does not match CMake VERSION $VER (expected v$VER)"; exit 1; }
          else
            TAG="v$VER"
          fi
          python3 tools/release/changelog_section.py "$VER" > notes.md
          echo "--- release notes ($TAG) ---"; cat notes.md
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  windows:
    name: Windows x64 package
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120   # a signed release waits up to an hour for its SignPath approval
    # actions: read lets SignPath read this job and download the unsigned-exe artifact with the
    # run's token (the action's github-token); the workflow default grants contents only.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: msys2 {0}
    env:
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.test_sign == true) }}
      SIGNING_POLICY: ${{ startsWith(github.ref, 'refs/tags/v') && (vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing') || 'test-signing' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: git
          pacboy: gcc:p cmake:p ninja:p python:p ccache:p
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-windows-${{ github.sha }}
          restore-keys: ccache-release-windows-
      - name: Build OpenBA (release)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/build.sh build release
      - name: Unit tests (release)
        run: tools/build.sh unit release
      # SignPath's origin verification takes the exe from this run's own artifact, so it must be
      # uploaded by actions/upload-artifact from this GitHub-hosted job. The artifact configuration
      # (tools/release/signpath/artifact-configuration.xml) signs OpenBA.exe at the artifact's root
      # and refuses it unless its VERSIONINFO says ProductName OpenBA and this version.
      - name: Upload the unsigned exe
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: build/cmake-release/OpenBA.exe
          if-no-files-found: error
          retention-days: 7
      - name: Sign (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'OpenBA' }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}   # empty: the project's default
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            version: "${{ needs.version.outputs.version }}"
      - name: Use the signed exe
        if: env.SIGN == 'true'
        run: cp -f signed/OpenBA.exe build/cmake-release/OpenBA.exe
      - name: Check the signature
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature build/cmake-release/OpenBA.exe
          "Status: $($sig.Status)  Signer: $($sig.SignerCertificate.Subject)  Timestamp: $($sig.TimeStamperCertificate.Subject)"
          # test-signing uses a certificate no Windows machine trusts: it is signed, not Valid.
          $ok = if ($env:SIGNING_POLICY -eq 'test-signing') { [bool]$sig.SignerCertificate } else { $sig.Status -eq 'Valid' }
          if (-not $ok) { exit 1 }
      - name: Package
        run: tools/release/package.sh windows "${{ needs.version.outputs.version }}" dist
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  linux:
    name: Linux x64 package
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build ccache libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxtst-dev libxfixes-dev libwayland-dev libxkbcommon-dev libegl-dev \
            libdecor-0-dev libasound2-dev libpulse-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-linux-${{ github.sha }}
          restore-keys: ccache-release-linux-
      - name: Fetch dxvk-native
        run: tools/fetch_dxvk_native.sh
      - name: Build OpenBA (release)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/build.sh build release
      - name: Unit tests (release)
        run: tools/build.sh unit release
      - name: Package
        run: tools/release/package.sh linux "${{ needs.version.outputs.version }}" dist
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  macos:
    name: macOS arm64 package
    needs: version
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Packages
        run: brew install ninja ccache meson
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-release-macos-${{ github.sha }}
          restore-keys: ccache-release-macos-
      # The shader converter (libairconv.dylib: DXMT + a partial LLVM 15 build) is the slow part of
      # tools/macos/setup_deps.sh; cached under that script's hash, so a pin change rebuilds it.
      - uses: actions/cache@v4
        with:
          path: |
            third_party/dxmt_src
            third_party/llvm15_arm64
            third_party/airconv_build
          key: airconv-${{ hashFiles('tools/macos/setup_deps.sh') }}
      - name: App bundle (release)
        run: CMAKE_EXTRA="$CCACHE_LAUNCHERS" tools/macos/make_app.sh dist/OpenBA.app
      - name: Release zip
        run: |
          tools/macos/make_release_zip.sh dist/OpenBA.app dist
          VER="${{ needs.version.outputs.version }}"
          mv dist/OpenBA-mac-arm64.zip "dist/OpenBA-v$VER-mac-arm64.zip"
          rm -f dist/OpenBA-mac-arm64.zip.sha256
          (cd dist && shasum -a 256 "OpenBA-v$VER-mac-arm64.zip" > "OpenBA-v$VER-mac-arm64.zip.sha256" && cat "OpenBA-v$VER-mac-arm64.zip.sha256")
      - name: ccache statistics
        if: always()
        run: ccache -s
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # SignPath Foundation's terms ask every release page that carries a signed exe to link the
      # code signing policy.
      - name: Code signing policy link
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          printf '\n---\n[Code signing policy](%s/%s/blob/%s/CODE_SIGNING.md): free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> artifacts/release-notes/notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -lR artifacts
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "OpenBA $TAG" --notes-file artifacts/release-notes/notes.md \
            artifacts/package-windows/* artifacts/package-linux/* artifacts/package-macos/*
